name: AEGIS AI service CI

on:
  workflow_dispatch:
  push:
    paths:
      - "services/ai/**"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    paths:
      - "services/ai/**"
      - ".github/workflows/ai-service-ci.yml"

permissions:
  contents: read

jobs:
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install AI service
        run: python -m pip install -e ".[dev]"
        working-directory: services/ai
      - name: Run tests
        run: python -m pytest -q
        working-directory: services/ai
      - name: Lint
        run: python -m ruff check src tests
        working-directory: services/ai
