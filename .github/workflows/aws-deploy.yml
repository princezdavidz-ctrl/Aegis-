name: Deploy AEGIS to AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aegis-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN AWS_REGION AWS_ACCOUNT_ID ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_CONTAINER_NAME FRONTEND_S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable: $name"
              exit 1
            fi
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_ACCOUNT_ID must contain 12 digits"; exit 1; }

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: AegisGitHubActionsDeploy

      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT" || {
            echo "::error::Authenticated to unexpected AWS account"
            exit 1
          }

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable API image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --pull -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update ECS task definition image
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          CONTAINER: ${{ vars.ECS_CONTAINER_NAME }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          TASK_DEFINITION_ARN="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)"
          test "$TASK_DEFINITION_ARN" != "None" || { echo "::error::ECS service not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN" --query taskDefinition > task-definition.json
          jq --arg name "$CONTAINER" --arg image "$IMAGE" '
            .containerDefinitions |= map(if .name == $name then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' task-definition.json > task-definition-updated.json
          jq -e --arg name "$CONTAINER" '.containerDefinitions | any(.name == $name)' task-definition-updated.json >/dev/null
          NEW_TASK_DEFINITION="$(aws ecs register-task-definition --cli-input-json file://task-definition-updated.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_TASK_DEFINITION" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish frontend to private S3 origin
        env:
          BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
        run: aws s3 sync frontend/dist/ "s3://$BUCKET/" --delete

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"

      - name: Deployment summary
        run: |
          {
            echo "## AEGIS AWS deployment"
            echo "- Region: ${{ vars.AWS_REGION }}"
            echo "- API image: ${{ steps.image.outputs.uri }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- ECS service reached stable state."
            echo "- Frontend uploaded and CloudFront invalidation requested."
          } >> "$GITHUB_STEP_SUMMARY"
