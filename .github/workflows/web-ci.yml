name: AEGIS checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "integrate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Test and build web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build

  api:
    name: Test Python API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install AEGIS AI runtime package
        run: python -m pip install --disable-pip-version-check -e services/ai
      - name: Install pinned API dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Run API tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - name: Compile API modules
        run: python -m compileall -q backend/app


  linux-agent:
    name: Test Linux endpoint agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check -r agents/linux/requirements.txt
      - name: Run Linux agent tests
        working-directory: agents/linux
        run: python -m unittest discover -s tests -v
      - name: Compile Linux agent
        run: python -m compileall -q agents/linux


  windows-agent:
    name: Test Windows endpoint agent
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check -r agents/windows/requirements.txt
      - name: Run Windows native agent tests
        working-directory: agents/windows
        run: python -m unittest discover -s tests -v
      - name: Compile Windows agent
        run: python -m compileall -q agents/windows

  postgres-integration:
    name: PostgreSQL migration and least-privilege RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis_migrator:aegis_ci_migrator_password@localhost:5432/aegis_test
      AEGIS_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis_test
      AEGIS_TEST_DATABASE_URL: postgresql+asyncpg://aegis_runtime:aegis_ci_runtime_password@localhost:5432/aegis_test
      AEGIS_TEST_MUTATOR_DATABASE_URL: postgresql+asyncpg://aegis_test_mutator:aegis_ci_mutator_password@localhost:5432/aegis_test
      AEGIS_TEST_PROVISIONER_DATABASE_URL: postgresql+asyncpg://aegis_provisioner:aegis_ci_provisioner_password@localhost:5432/aegis_test
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install AEGIS AI runtime package
        run: python -m pip install --disable-pip-version-check -e services/ai
      - name: Install API and migration dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Create non-superuser migration and runtime roles
        run: psql -h localhost -U postgres -d aegis_test -v db_name=aegis_test -v ON_ERROR_STOP=1 -f deploy/postgres/roles.sql
      - name: Configure CI-only passwords and audit trigger test role
        run: psql -h localhost -U postgres -d aegis_test -v ON_ERROR_STOP=1 -f backend/tests/postgres_runtime_role.sql
      - name: Apply migrations as the dedicated migration owner
        run: alembic -c backend/alembic.ini upgrade head
      - name: Grant least-privilege runtime permissions
        env:
          PGPASSWORD: aegis_ci_migrator_password
        run: psql -h localhost -U aegis_migrator -d aegis_test -v ON_ERROR_STOP=1 -f deploy/postgres/grants.sql
      - name: Grant test-only audit mutation privileges
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aegis_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, UPDATE, DELETE ON TABLE audit_events TO aegis_test_mutator"
      - name: Verify tenant RLS, provisioning function and least-privilege roles
        run: python -m pytest backend/tests/test_postgres_rls.py backend/tests/test_postgres_memberships.py backend/tests/test_postgres_tenant_profile.py backend/tests/test_postgres_assets.py -q

  container-smoke:
    name: Build and smoke-test API container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull -f backend/Dockerfile -t aegis-api:ci .
      - name: Start API container
        run: docker run --detach --name aegis-api -p 8000:8000 aegis-api:ci
      - name: Verify liveness and readiness endpoints
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
      - name: Collect container logs on failure
        if: failure()
        run: docker logs aegis-api
      - name: Stop API container
        if: always()
        run: docker rm --force aegis-api || true

  terraform-validate:
    name: Validate AWS OIDC Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/oidc-role
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate Terraform configuration
        run: terraform validate
