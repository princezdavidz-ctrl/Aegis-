name: AEGIS checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Test and build web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build

  api:
    name: Test Python API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned API dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Run API tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - name: Compile API modules
        run: python -m compileall -q backend/app
