name: AEGIS Flutter desktop checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "integrate/**"
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flutter:
    name: Format, analyze and test Flutter desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/engineer-desktop
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Dart code
        # SDK-level info deprecations remain visible; warnings and errors stay fatal.
        run: flutter analyze --fatal-warnings
      - name: Run widget and unit tests
        run: flutter test --reporter expanded
