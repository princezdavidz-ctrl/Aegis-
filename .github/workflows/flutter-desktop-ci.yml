name: AEGIS Flutter desktop checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "integrate/**"
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flutter:
    name: Format, analyze and test Flutter desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/engineer-desktop
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply canonical Dart formatting
        run: dart format lib test
      - name: Commit formatting when needed
        working-directory: .
        run: |
          if ! git diff --quiet -- apps/engineer-desktop/lib apps/engineer-desktop/test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/engineer-desktop/lib apps/engineer-desktop/test
            git commit -m "style(desktop): apply Dart formatter"
            git push
          fi
      - name: Analyze Dart code
        run: flutter analyze --fatal-infos
      - name: Run widget and unit tests
        run: flutter test --reporter expanded
