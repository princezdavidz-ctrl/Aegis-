name: AEGIS Flutter desktop checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

concurrency:
  group: flutter-desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze and test Flutter desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/engineer-desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/core/config/app_config.dart test/core/app_config_test.dart
      - name: Analyze Dart code
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test --reporter expanded

  desktop-build:
    name: Build ${{ matrix.platform }} desktop
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/engineer-desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate native desktop runner
        run: flutter create --platforms=${{ matrix.platform }} .
      - name: Build release application
        run: flutter build ${{ matrix.platform }} --release
