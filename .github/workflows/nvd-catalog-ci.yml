name: AEGIS NVD catalogue checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/vulnerability_intel/**"
      - "backend/scripts/sync_nvd_cves.py"
      - "backend/migrations/versions/0006_cve_catalog.py"
      - "backend/tests/test_nvd_sync.py"
      - "deploy/postgres/roles.sql"
      - "deploy/postgres/grants.sql"
      - ".github/workflows/nvd-catalog-ci.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/app/vulnerability_intel/**"
      - "backend/scripts/sync_nvd_cves.py"
      - "backend/migrations/versions/0006_cve_catalog.py"
      - "backend/tests/test_nvd_sync.py"
      - "deploy/postgres/roles.sql"
      - "deploy/postgres/grants.sql"
      - ".github/workflows/nvd-catalog-ci.yml"

permissions:
  contents: read

jobs:
  nvd-importer:
    name: Test NVD feed importer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend and AI dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          python -m pip install -e services/ai ruff
      - name: Lint NVD importer
        run: ruff check backend/app/vulnerability_intel backend/scripts/sync_nvd_cves.py backend/tests/test_nvd_sync.py
      - name: Test NVD importer
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_nvd_sync.py
